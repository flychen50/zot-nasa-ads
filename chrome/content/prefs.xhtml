<vbox>
	<groupbox>
		<label><html:h2>NASA ADS Settings</html:h2></label>
        <html:div style="margin: 0.5em 0">
            <hbox align="center">
                <label value="API Key:" />
                <html:input id="zot-nasa-ads-api-key" type="text" style="flex-grow: 1;" preference="extensions.zot-nasa-ads.api-key" />
            </hbox>
        </html:div>
        <html:p style="margin-left: 0.5em; color: #555; font-size: 0.9em;">
            You need a NASA ADS API key to use this plugin. Get yours at 
            <html:a href="https://ui.adsabs.harvard.edu/user/settings/token" 
                   target="_blank"
                   style="color: #0366d6; text-decoration: none;">
                ui.adsabs.harvard.edu/user/settings/token
            </html:a>
        </html:p>
	</groupbox>
</vbox>
